project:
  type: website
  output-dir: docs
  resources:
    - img/
    - css/
    - slides/


website:
  title: "Pseudobulk for single-cell RNA-seq"
  google-analytics: G-68JBPLLNLG
  page-footer: >
      This lesson has been developed by members of the teaching team at the [Harvard Chan Bioinformatics Core (HBC)](http://bioinformatics.sph.harvard.edu/). <br>
      These are open access materials distributed under the terms of the [Creative Commons Attribution license](https://creativecommons.org/licenses/by/4.0/) (CC BY 4.0), which permits unrestricted use, distribution, and reproduction in any medium, provided the original author and source are credited. <br>
  
  navbar:
    left:
      - text: "Schedule"
        href: lessons/schedule.qmd
    right:
      - text: "HBC"
        href: https://bioinformatics.sph.harvard.edu/
      - text: "GitHub"
        href: https://github.com/hbctraining/Intro-to-scRNAseq-Quarto
      - text: "Contact us"
        href: mailto:hbctraining@hsph.harvard.edu
  
  
  sidebar:
    title: "Lessons"      # Optional title above the sidebar
    style: "docked"       # Sidebar is docked to the left
    collapse-level: 1     # At what header level to start collapsing
    # contents: auto      # Creates automatic TOC from page headers (no sections)
    contents:
      - section: "Pre-reading:"
        contents:
        - text: "Introduction to scRNA-seq"
          href: "https://hbctraining.github.io/Intro-to-scRNAseq-Quarto/lessons/01_intro_to_scRNA-seq.html"
        - text: "scRNA-seq: From sequence reads to count matrix"
          href: "https://hbctraining.github.io/Intro-to-scRNAseq-Quarto/lessons/02_SC_generation_of_count_matrix.html"
        - lessons/01_counts_to_clusters_overview.qmd

      - section: "Day 1:"
        contents:
          - lessons/02_setup_intro_dataset.qmd
          - lessons/03_DEanalysis_using_FindMarkers.qmd
      - section: "Day 1 Self-learning:"
        contents:
          - lessons/04_DEanalysis_FindMarkers_visualization.qmd
          - lessons/05_theory_of_PCA.qmd
          
      - section: "Day 2:"
        contents:
          - lessons/06_pseudobulk_DESeq2.qmd
          - lessons/07_pseudobulk_DE_analysis.qmd
          
      - section: "Day 3:"
        contents:
          - lessons/08_pseudobulk_DE_visualizations.qmd
          - lessons/09_DE_comparisons.qmd
          
      - section: "Day 3 Self-learning:"
        contents:
          - lessons/10_functional_analysis_pseudobulk.qmd

      - section: "Day 4:"
        contents:
          - lessons/11_differential_abundance.qmd
          

format:
  html:
    theme: simplex
    css: css/styles.css
    fig-align: "center"
    toc: true
    number-sections: false
    code-block-bg: true
    code-copy: true      # enables copy button (default in most themes)
    code-tools: true     # enables the copy button!
    code-line-wrap: wrap
    prompt: true

# Global Execution Defaults
execute:
  echo: true               # show code
  eval: true               # run code
  warning: false           # show warnings
  error: false             # show errors
  message: false           # show messages
  prompt: true
